name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  enable-automerge:
    name: Enable Dependabot auto-merge
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This privileged workflow only calls GitHub's API; never check out PR code.
      - name: Enable native auto-merge after required checks pass
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.pull_request.number
            });
            if (pr.user.login !== 'dependabot[bot]' || pr.draft || pr.state !== 'open' ||
                pr.head.repo?.full_name !== `${owner}/${repo}` ||
                pr.base.ref !== context.payload.repository.default_branch) {
              core.info('Pull request is not eligible for Dependabot auto-merge.');
              return;
            }
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (!repository.allow_auto_merge || !repository.allow_squash_merge) {
              core.setFailed('Enable Allow auto-merge and Allow squash merging in repository settings.');
              return;
            }
            // An empty required-check list lets native auto-merge bypass CI.
            const { data: rules } = await github.rest.repos.getBranchRules({
              owner, repo, branch: pr.base.ref
            });
            const requiredChecks = new Set(rules
              .filter(rule => rule.type === 'required_status_checks')
              .flatMap(rule => rule.parameters?.required_status_checks ?? [])
              .map(check => check.context));
            const expectedChecks = [
              'Build and validate extensions',
              'Review dependency changes',
              'Analyze JavaScript'
            ];
            const missing = expectedChecks.filter(check => !requiredChecks.has(check));
            if (missing.length) {
              core.setFailed(`Add these required checks to the branch ruleset: ${missing.join(', ')}`);
              return;
            }
            if (pr.auto_merge) {
              core.info('Auto-merge is already enabled.');
              return;
            }
            await github.graphql(`
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId, mergeMethod: SQUASH
                }) { pullRequest { number } }
              }
            `, { pullRequestId: pr.node_id });

