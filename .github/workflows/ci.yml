name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Chrome and Firefox packages
        run: npm run build
      - name: Validate Chrome and Firefox manifests
        run: npm run lint
      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: laboratory-browser-extensions
          path: dist/*.zip
          if-no-files-found: error
