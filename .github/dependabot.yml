version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    open-pull-requests-limit: 10
    groups:
      babel:
        patterns:
          - "@babel/*"
          - "babel-loader"
      webpack:
        patterns:
          - "webpack"
          - "webpack-cli"
          - "*webpack-plugin"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Zurich
