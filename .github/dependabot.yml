version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    # Renovate owns routine npm updates; Dependabot handles security fixes.
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
